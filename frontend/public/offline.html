<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - FarmAI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 50%, #fed7aa 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 24px;
      padding: 48px 32px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    .icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #f97316 0%, #c2410c 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      box-shadow: 0 10px 30px rgba(249, 115, 22, 0.3);
    }
    h1 {
      color: #7c2d12;
      font-size: 32px;
      margin-bottom: 16px;
      font-weight: 700;
    }
    p {
      color: #78350f;
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .features {
      background: #fffbeb;
      border-radius: 16px;
      padding: 24px;
      margin: 32px 0;
      text-align: left;
    }
    .feature-item {
      display: flex;
      align-items: center;
      margin: 12px 0;
      color: #78350f;
    }
    .feature-item::before {
      content: '✓';
      display: inline-block;
      width: 24px;
      height: 24px;
      background: #f97316;
      color: white;
      border-radius: 50%;
      text-align: center;
      line-height: 24px;
      margin-right: 12px;
      font-weight: bold;
      flex-shrink: 0;
    }
    .button {
      background: linear-gradient(135deg, #f97316 0%, #c2410c 100%);
      color: white;
      border: none;
      padding: 16px 32px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      display: inline-block;
    }
    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(249, 115, 22, 0.4);
    }
    .button:active {
      transform: translateY(0);
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: #fee2e2;
      color: #991b1b;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      margin-top: 16px;
    }
    .pulse {
      width: 8px;
      height: 8px;
      background: #dc2626;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🌾</div>
    <h1>You're Offline</h1>
    <p>No internet connection detected. Don't worry, some features are still available!</p>
    
    <div class="features">
      <div class="feature-item">View cached farm data</div>
      <div class="feature-item">Access previous recommendations</div>
      <div class="feature-item">Browse help documentation</div>
    </div>

    <button class="button" onclick="window.location.reload()">
      🔄 Try Again
    </button>

    <div class="status">
      <span class="pulse"></span>
      <span>Offline Mode</span>
    </div>
  </div>

  <script>
    // Auto-reload when back online
    window.addEventListener('online', () => {
      console.log('✅ Back online!');
      setTimeout(() => {
        window.location.reload();
      }, 1000);
    });

    // Check connection every 5 seconds
    setInterval(() => {
      if (navigator.onLine) {
        window.location.reload();
      }
    }, 5000);
  </script>
</body>
</html>
